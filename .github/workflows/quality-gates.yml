name: quality-gates

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      PNPM_VERSION: "10.31.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Policy checks
        run: node scripts/ci/require-tests-and-docs.mjs

      - name: Frontend and docs verification
        run: |
          pnpm git:guard:all
          pnpm lint
          pnpm typecheck
          pnpm test -- --run
          pnpm test:coverage
          pnpm build
          pnpm docs:check

      - name: Diff coverage
        if: github.event_name == 'pull_request'
        env:
          DIFF_BASE: origin/${{ github.base_ref }}
        run: |
          python -m pip install --upgrade pip diff-cover
          diff-cover coverage/lcov.info --compare-branch="$DIFF_BASE" --fail-under=90

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts
          path: |
            playwright-report/
            test-results/
            coverage/

  quality-gates:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - name: Confirm quality gate suite
        run: echo "quality-gates suite passed"
